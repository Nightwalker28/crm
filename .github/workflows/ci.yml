name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare Compose environment
        run: touch .env

      - name: Start application services
        run: docker compose up -d --build postgres redis backend frontend

      - name: Run local parity checks
        run: ./scripts/codex-check.sh

      - name: Run Lead journey behavior baseline
        run: >-
          docker compose run --rm frontend-e2e
          npm run test:e2e --
          leads-revamp.spec.ts
          --grep "Lead journey behavior baseline"

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color backend frontend postgres redis
